packages:
  - 'packages/*'
  - 'packages/frameworks/*'
  - 'examples/*'
  - 'docs'

# ──────────────────────────────────────────────
# Version Catalog
# Centralized external dependency version management across the workspace.
# Usage: reference via "catalog:" protocol in package.json
#   e.g. "react": "catalog:"  →  resolves to the version below
# ──────────────────────────────────────────────

catalog:
  # ── Runtime ──
  react: 19.1.0
  react-dom: 19.1.0
  react-native: 0.81.5
  react-native-webview: ^13.15.0
  react-router-dom: ^6.22.0
  use-sync-external-store: ^1.6.0
  ws: ^8.17.0

  # ── Build ──
  typescript: ^5.4.5
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  '@vitejs/plugin-react': ^6.1.1
  vite-plugin-singlefile: ^2.3.3

  # ── Types ──
  '@types/node': ^20.14.0
  '@types/react': ~19.1.0
  '@types/react-dom': ~19.1.0
  '@types/use-sync-external-store': ^1.5.0
  '@types/ws': ^8.18.1

  # ── Lint / Format ──
  eslint: ^8.56.0
  '@typescript-eslint/eslint-plugin': ^7.0.0
  '@typescript-eslint/parser': ^7.0.0

  # ── Schema (validation & codegen) ──
  zod: ^4.0.0
  valibot: ^1.1.0
  jiti: ^2.4.2

  # ── Test ──
  vitest: 4.1.11
  '@vitest/ui': 4.1.11
  happy-dom: ^14.12.0
  '@testing-library/react': ^16.1.0
  '@testing-library/dom': ^10.4.0
  '@testing-library/jest-dom': ^6.9.1

  # ── Release ──
  '@changesets/cli': ^2.27.1
  husky: ^9.1.7
  lint-staged: ^16.4.0
  vite-plus: 0.3.0
  '@vitest/coverage-v8': 4.1.11
